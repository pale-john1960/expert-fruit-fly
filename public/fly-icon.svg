<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Expert Fruit Fly — app icon: dark lab tile, amber fly head, red compound eye -->
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- dark tile with amber→emerald hairline edge -->
  <rect width="64" height="64" rx="14" fill="#141518"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- antenna -->
  <path d="M24 22 Q16 14 13 6" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <circle cx="13" cy="6" r="3" fill="#b45309"/>

  <!-- head -->
  <circle cx="30" cy="32" r="17" fill="url(#head)" stroke="#92400e" stroke-width="1.6"/>

  <!-- red compound eye with hexagonal sheen -->
  <circle cx="27" cy="30" r="11.5" fill="#f87171"/>
  <circle cx="27" cy="30" r="11.5" fill="none" stroke="#9f123e" stroke-width="1.6"/>
  <circle cx="23" cy="25.5" r="3" fill="#fecaca" opacity="0.85"/>

  <!-- tiny ocelli -->
  <circle cx="39" cy="24" r="1.8" fill="#78350f"/>
  <circle cx="42" cy="29" r="1.8" fill="#78350f"/>

  <!-- proboscis hint -->
  <path d="M40 44 q3 3 6 3" fill="none" stroke="#92400e" stroke-width="2.4" stroke-linecap="round"/>
</svg>
